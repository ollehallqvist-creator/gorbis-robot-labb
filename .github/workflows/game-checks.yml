name: Game checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: node tests/check-inline-script.js
      - name: Check all 24 levels
        run: node tests/level-generation.test.js
      - name: Check robot part variants
        run: node tests/robot-variants.test.js
      - name: Check synthesized sound cues
        run: node tests/sound-cues.test.js
      - name: Check title screen and welcome-room scene
        run: node tests/title-screen.test.js
      - name: Check cavern level art and mechanics\n        run: node tests/level-art.test.js\n      - name: Check robot builder carousel controls\n        run: node tests/robot-builder.test.js\n      - name: Check robot model materials\n        run: node tests/robot-materials.test.js\n